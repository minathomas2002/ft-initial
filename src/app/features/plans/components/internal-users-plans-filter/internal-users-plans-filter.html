<div class="flex flex-col md:flex-row gap-4">
    <div class="grid grid-cols-12 gap-4">
        <div class="col-span-12 md:col-span-2">
            <div class="flex flex-col">
                <input
                    type="text"
                    pInputText
                    name="planSearch"
                    [placeholder]="'plans.filter.dvsearchPlaceholder' | translate"
                    [ngModel]="filter().searchText ?? ''"
                    (ngModelChange)="onSearchTextChange($event)"
                />
            </div>
        </div>

        <div class="col-span-12 md:col-span-2">
            <div class="flex flex-col">
                <p-multiSelect
                    name="planType"
                    [options]="planTypeOptions()"
                    [ngModel]="filter().planType"
                    (ngModelChange)="onPlanTypeChange($event)"
                    [placeholder]="'plans.filter.selectPlanType' | translate"
                    optionLabel="label"
                    optionValue="value"
                    [showClear]="true"
                    appendTo="body"
                ></p-multiSelect>
            </div>
        </div>

        <div class="col-span-12 md:col-span-2">
            <div class="flex flex-col">
                <p-multiSelect
                    name="assignee"
                    [options]="assigneeOptions()"
                    [ngModel]="filter().assignee"
                    (ngModelChange)="onAssigneeChange($event)"
                    [placeholder]="'plans.filter.selectAssignee' | translate"
                    optionLabel="label"
                    optionValue="value"
                    [showClear]="true"
                    [loading]="isLoadingAssignees()"
                    appendTo="body"
                ></p-multiSelect>
            </div>
        </div>

        <div class="col-span-12 md:col-span-2">
            <div class="flex flex-col">
              <p-select
                [options]="opportunitiesList()"
                optionLabel="name"
                optionValue="id"
                [placeholder]="'opportunities'"
                [loading]="isLoadingopportunitiesList()"
                [filter]="true"
                filterBy="name"
                [ngModel]="filter().opportunityId"
                (ngModelChange)="onOpportunityChange($event)"
                [showClear]="true"
                fluid
              />
            </div>
        </div>

        <div class="col-span-12 md:col-span-2">
            <div class="flex flex-col">
                <p-multiSelect
                    name="status"
                    [options]="statusOptions()"
                    [ngModel]="filter().status"
                    (ngModelChange)="onStatusChange($event)"
                    [placeholder]="'plans.filter.selectStatus' | translate"
                    optionLabel="label"
                    optionValue="value"
                    [showClear]="true"
                    appendTo="body"
                ></p-multiSelect>
            </div>
        </div>

        <div class="col-span-12 md:col-span-2">
            <div class="flex flex-col">
                <p-datepicker
                    name="submissionDate"
                    selectionMode="range"
                    [readonlyInput]="true"
                    [(ngModel)]="filter().submissionDate"
                    (ngModelChange)="onPickerChange($event)"
                    [dateFormat]="'dd M yy'"
                    [showIcon]="true"
                    [showButtonBar]="true"
                    [iconDisplay]="'input'"
                    [placeholder]="'plans.filter.selectSubmissionDate' | translate"
                    appendTo="body"
                ></p-datepicker>
            </div>
        </div>
    </div>@if(filterService.showClearAll()) {
    <div>
        <div class="flex h-full items-center md:justify-end">
            <p-overlaybadge
                [value]="filterService.activeFiltersCount()"
                severity="danger"
                class="filter-reset-badge"
            >
                <p-button
                    [severity]="'secondary'"
                    (click)="onClearFilters()"
                    [rounded]="true"
                    [icon]="'icon-reload'"
                    [outlined]="true"
                    [ariaLabel]="'plans.filter.reset' | translate"
                >
                </p-button>
            </p-overlaybadge>
        </div>
    </div>
    }
</div>
