<app-sections-layout pageTitle="My Profile">
  <ng-container ngProjectAs="page-body">
    <app-user-image-section (onProfilePictureUpdated)="refreshUserDate()"></app-user-image-section>
    <app-personal-information-section (onPersonalInfoUpdate)="refreshUserDate()"></app-personal-information-section>
    <app-security-section></app-security-section>
    @if(canViewSignature()){
    <app-signature-section (onSignatureUpdate)="refreshUserDate()"></app-signature-section>
    }
  </ng-container>
</app-sections-layout>
