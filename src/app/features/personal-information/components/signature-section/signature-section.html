<app-personal-information-card
  [sectionTitle]="'Signature'"
  [sectionDescription]="'Update your signature here.'"
  [hideFooter]="true"
>
  @if(isViewMode() && !existingSignature()){
  <div class="flex flex-col justify-center items-center gap-6">
    <div class="flex justify-center items-center">
      <p class="text-sm text-gray-500">No signature yet</p>
    </div>
    <div class="flex gap-4">
      <p-button
        [label]="'Draw Signature'"
        severity="secondary"
        icon="icon-edit-04"
        (onClick)="onAddSignatureClick()"
      />
      <p-button
        [label]="'upload Signature'"
        severity="secondary"
        icon="icon-file-upload"
        (onClick)="onChangeSignatureClick()"
      />
    </div>
  </div>
  }@else {
  <div class="flex justify-center items-center bg-gray-50 rounded-lg p-6 border border-gray-200 relative">
    <p-button
      [label]="'Delete'"
      icon="icon-trash-2"
      severity="danger"
      size="small"
      class="absolute top-2 right-2"
      text
      (onClick)="onDeleteSignatureClick()"
    />
    <div class="md:max-w-[50%]">
      <p-image
        [src]="'assets/images/opportunity-1.png'"
        alt="Signature"
        [preview]="true"
      />
    </div>
  </div>
  }
</app-personal-information-card>

<app-upload-signature-modal
  [(visible)]="uploadSignatureModalVisible"
  (onSubmitSignature)="onSubmitSignature($event)"
/>
<app-draw-signature-modal
  [(visible)]="drawSignatureModalVisible"
  (onSubmitSignature)="onSubmitSignature($event)"
/>
