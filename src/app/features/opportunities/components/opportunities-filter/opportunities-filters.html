<div class="flex flex-col md:flex-row gap-4">
  <div class="grid grid-cols-12 gap-4 flex-1">
    <div class="col-span-12">
      <p-iconfield>
        <p-inputicon
          inputId="opportunities-search"
          class="icon-search"
        />
        <input
          type="text"
          pInputText
          class="w-full"
          [placeholder]="'opportunity.filter.search' | translate"
          [ngModel]="filter().searchText"
          (ngModelChange)="onSearchTextChange($event)"
        />
      </p-iconfield>
    </div>
  </div>

  @if(filterService.showClearAll()) {
  <div>
    <div class="flex h-full items-center md:justify-end">
      <p-overlaybadge
        [value]="filterService.activeFiltersCount()"
        severity="danger"
        class="filter-reset-badge"
      >
        <p-button
          [severity]="'secondary'"
          (click)="onClearFilters()"
          [rounded]="true"
          [icon]="'icon-reload'"
          [outlined]="true"
          [ariaLabel]="'plans.filter.reset' | translate"
        >
        </p-button>
      </p-overlaybadge>
    </div>
  </div>
  }
</div>
