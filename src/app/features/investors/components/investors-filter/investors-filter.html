<div class="flex flex-col md:flex-row gap-4">
  <div class="grid grid-cols-12 gap-4 flex-1">
    <div class="col-span-12 md:col-span-8">
      <div class="flex flex-col">
        <input
          type="text"
          pInputText
          name="investorSearch"
          [placeholder]="'investors.filter.searchPlaceholder' | translate"
          [ngModel]="filter().searchText ?? ''"
          (ngModelChange)="onSearchTextChange($event)"
        />
      </div>
    </div>

    <div class="col-span-12 md:col-span-4">
      <div class="flex flex-col">
        <p-datepicker
          name="investorJoinDate"
          selectionMode="range"
          [readonlyInput]="true"
          [(ngModel)]="filter().joinDate"
          (ngModelChange)="onPickerChange($event)"
          [showIcon]="true"
          [showButtonBar]="true"
          [iconDisplay]="'input'"
          [placeholder]="'investors.filter.selectJoinDate' | translate"
          appendTo="body"
        ></p-datepicker>
      </div>
    </div>
  </div>

  @if(filterService.showClearAll()) {
  <div>
    <div class="flex h-full items-center md:justify-end">
      <p-overlaybadge
        [value]="filterService.activeFiltersCount()"
        severity="danger"
        class="filter-reset-badge"
      >
        <p-button
          [severity]="'secondary'"
          (click)="onClearFilters()"
          [rounded]="true"
          [icon]="'icon-reload'"
          [outlined]="true"
          [ariaLabel]="'plans.filter.reset' | translate"
        >
        </p-button>
      </p-overlaybadge>
    </div>
  </div>
  }
</div>
