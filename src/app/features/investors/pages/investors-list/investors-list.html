<div class="cards-page-layout px-[32px] py-[24px]">
  <app-table-layout
    [tableTitle]="'investors.list.title' | translate"
    [tableSubTitle]="'investors.list.subtitle' | translate"
  >
    <ng-container ngProjectAs="table-filters">
      <app-investors-filter></app-investors-filter>
    </ng-container>

    <ng-container ngProjectAs="table-body">
      <app-table-skeleton
        [headers]="headers()"
        [isLoading]="isLoading()"
      >
        <app-data-table
          [columns]="headers()"
          [rows]="rows()"
          [(filter)]="filterService.filter"
          [totalRecords]="totalRecords()"
          (filterChange)="filterService.applyFilterWithPaging()"
          (sortChange)="filterService.applyFilter()"
          [messageTitle]="'investors.list.noInvestorsFound' | translate"
          [showCheckBox]="false"
          [rowsCheckable]="false"
        >
          <ng-template
            #itemsTemplate
            let-item="item"
          >
            <td class="whitespace-nowrap ltr">
              {{ item.code }}
            </td>
            <td class="whitespace-nowrap">
              <div class="flex items-center gap-3">
                <p-avatar
                  [image]="item.photo || 'assets/images/user_placeholder.svg'"
                  shape="circle"
                  size="normal"
                  class="!w-[32px] !h-[32px] flex-shrink-0"
                />
                {{ item.fullName }}
              </div>
            </td>
            <td class="whitespace-nowrap">
              <p class="text-sm text-gray-600 max-w-[220px] truncate ltr">
                {{ item.email }}
              </p>
            </td>
            <td class="whitespace-nowrap">{{ item.countryCode }} {{ item.phoneNumber }}</td>
            <td class="whitespace-nowrap">{{ item.otherPhone || '-' }}</td>
            <td class="whitespace-nowrap">
              @if(item.numberOfSubmittedPlans > 0){
              <ng-container>
                <a
                  class="text-primary cursor-pointer underline"
                  (click)="goToInvestorPlans(item.id,item.fullName)"
                >
                  {{ item.numberOfSubmittedPlans }}
                </a>
              </ng-container>
              }@else{
              <ng-container>0</ng-container>
              }
            </td>
            <td class="whitespace-nowrap">{{ item.joinDate | localizedDate: 'dd MMM yyyy' }}</td>
          </ng-template>
        </app-data-table>
      </app-table-skeleton>
    </ng-container>
  </app-table-layout>
</div>
