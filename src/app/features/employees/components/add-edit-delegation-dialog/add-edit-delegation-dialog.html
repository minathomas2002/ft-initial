<app-base-dialog
  [(visible)]="dialogVisible"
  icon="icon-user-plus"
  [confirmLabel]="isEditMode()
  ? ('delegation.dialog.edit.confirmedit' | translate)
  : ('delegation.dialog.add.confirmAdd' | translate)"
  [confirmButtonClass]="'w-fit'"
  [cancelButtonClass]="'w-fit'"
  (onConfirm)="onConfirm()"
  (onClose)="resetForm()"
>
  <!--
  [isConfirmationDisabled]="formService.form.invalid" -->
  <div class="mb-5">
    <p class="text-lg font-semibold text-gray-900 mb-1">{{
      isEditMode()
      ? ('delegation.dialog.edit.confirmedit' | translate)
      : ('delegation.dialog.add.confirmAdd' | translate)
      }}</p>
  </div>

  <div class="form-group mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1">{{
      'delegation.dialog.delegator' | translate
      }}</label>
    <p-select
      [options]="employees()"
      optionLabel="name"
      optionValue="id"
      [loading]="isLoadingDetails()"
      [loadingIcon]="'icon-transfer'"
      [formControl]="formService.delegatorId"
      appendTo="body"
      optionLabel="name"
      optionValue="id"
      [placeholder]="'delegation.dialog.add.delegatorPlaceHolder' | translate"
      dropdownIcon="icon-chevron-down"
      fluid
    />
  </div>
  <div class="form-group">
    <label class="block text-sm font-medium text-gray-700 mb-1">{{
      'delegation.dialog.delegatee' | translate
      }}</label>
  <p-select
    [options]="employees()"
    optionLabel="name"
    optionValue="id"
    [loading]="isLoadingDetails()"
    [loadingIcon]="'icon-transfer'"
    [formControl]="formService.delegateeId"
    appendTo="body"
    optionLabel="name"
    optionValue="id"
    [placeholder]="'delegation.dialog.add.delegateePlaceHolder' | translate"
    dropdownIcon="icon-chevron-down"
    fluid
  />
  </div>
<div class="form-group mb-4">
  <label class="block text-sm font-medium text-gray-700 mb-1">
    {{ 'delegation.dialog.startDate' | translate }}
  </label>
  <p-datepicker
    [formControl]="formService.from"
    [readonlyInput]="true"
    [dateFormat]="'dd M yy'"
    [showIcon]="true"
    [showButtonBar]="true"
    [iconDisplay]="'input'"
    [minDate]="today"
    [maxDate]="formService.to.value"
    [disabledDates]="disabledStartDatesArray()"
    [placeholder]="'delegation.dialog.selectStartDate' | translate"
    appendTo="body"
  ></p-datepicker>
</div>

<div class="form-group">
  <label class="block text-sm font-medium text-gray-700 mb-1">
    {{ 'delegation.dialog.endDate' | translate }}
  </label>
  <p-datepicker
    [formControl]="formService.to"
    [readonlyInput]="true"
    [dateFormat]="'dd M yy'"
    [showIcon]="true"
    [showButtonBar]="true"
    [iconDisplay]="'input'"
    [minDate]="formService.from.value || today"
    [disabledDates]="[disabledEndDate()]"
    [placeholder]="'delegation.dialog.selectEndDate' | translate"
    appendTo="body"
  ></p-datepicker>
</div>


</app-base-dialog>
