<div class="flex flex-col md:flex-row gap-4">
  <div class="grid grid-cols-12 gap-4 flex-1">

    <div class="col-span-12 md:col-span-5">
      <p-iconfield>
        <p-inputicon
          inputId="role-management-search"
          class="icon-search"
        />
        <input
          class="w-full"
          type="text"
          pInputText
          [disabled]="disableFilterInputs()"
          [placeholder]="'users.filter.roleManagementSearchPlaceholder' | translate"
          [ngModel]="filter().searchText"
          (ngModelChange)="onSearchTextChange($event)"
        />
      </p-iconfield>
    </div>

    <div class="col-span-12 md:col-span-2">
      <p-multiselect
        [options]="employeeRoles()"
        [(ngModel)]="filter().roleIds"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'users.filter.rolePlaceholder' | translate"
        display="chip"
        dropdownIcon="icon-chevron-down"
        fluid
        (ngModelChange)="roleManagementFilterService.applyFilterWithPaging()"
      >
      </p-multiselect>
    </div>

    <div class="col-span-12 md:col-span-2">
      <p-multiselect
        [options]="userStatuses()"
        [(ngModel)]="filter().statusFilters"
        optionLabel="label"
        optionValue="value"
        [placeholder]="'users.filter.statusPlaceholder' | translate"
        display="chip"
        dropdownIcon="icon-chevron-down"
        fluid
        (ngModelChange)="roleManagementFilterService.applyFilterWithPaging()"
      >
      </p-multiselect>
    </div>

    <div class="col-span-12 md:col-span-3">
      <div class="flex flex-col">
        <p-datepicker
          name="roleManagementJoinDate"
          selectionMode="range"
          [readonlyInput]="true"
          [(ngModel)]="filter().assignedDate"
          (ngModelChange)="onPickerChange($event)"
          [dateFormat]="'dd M yy'"
          [showIcon]="true"
          [showButtonBar]="true"
          [iconDisplay]="'input'"
          [placeholder]="'users.filter.selectJoinDate' | translate"
          appendTo="body"
          showClear="true"
        ></p-datepicker>
      </div>
    </div>
  </div>

  @if(roleManagementFilterService.showClearAll()) {
  <div>
    <div class="flex h-full items-center md:justify-end">
      <p-overlaybadge
        [value]="roleManagementFilterService.activeFiltersCount()"
        severity="danger"
        class="filter-reset-badge"
      >
        <p-button
          [severity]="'secondary'"
          (click)="onClearFilters()"
          [rounded]="true"
          [icon]="'icon-reload'"
          [outlined]="true"
          [ariaLabel]="'plans.filter.reset' | translate"
        >
        </p-button>
      </p-overlaybadge>
    </div>
  </div>
  }
</div>
