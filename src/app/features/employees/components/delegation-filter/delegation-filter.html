<div class="grid grid-cols-12 gap-4">

  <div class="col-span-12 md:col-span-6">
    <p-iconfield>
      <p-inputicon inputId="users-search" class="icon-search" />
      <input class="w-full" type="text" pInputText [disabled]="disableFilterInputs()"
        [placeholder]="'delegation.filter.searchPlaceholder' | translate" [(ngModel)]="filter().searchText"
        (ngModelChange)="delegationSearchSubject.next(filter().searchText??'')" />
    </p-iconfield>
  </div>

  <div class="col-span-12 md:col-span-3">
    <p-multiselect [options]="delegationStatuses()" [(ngModel)]="filter().status" optionLabel="label" optionValue="value"
      [placeholder]="'delegation.filter.statusPlaceholder' | translate" display="chip" dropdownIcon="icon-chevron-down" fluid
      (ngModelChange)="delegationFilterService.applyFilterWithPaging()">
    </p-multiselect>
  </div>
  <div class="col-span-12 md:col-span-3">
    <div class="flex flex-col">
      <p-datepicker
        name="roleManagementJoinDate"
        selectionMode="range"
        [readonlyInput]="true"
        [(ngModel)]="filter().delegationPeriod"
        (ngModelChange)="onPickerChange($event)"
        [dateFormat]="'dd M yy'"
        [showIcon]="true"
        [showButtonBar]="true"
        [iconDisplay]="'input'"
        [placeholder]="'delegation.filter.selectDelegationPeriod' | translate"
        appendTo="body"
        showClear="true"
        fluid
      ></p-datepicker>
    </div>
  </div>

  @if(delegationFilterService.showClearAll()) {
  <div class="col-span-12 md:col-span-2">
    <div class="flex flex-col">
      <p-button
        [label]="'plans.filter.reset' | translate"
        [severity]="'secondary'"
        (click)="onClearFilters()"
        [styleClass]="'w-full'"
      ></p-button>
    </div>
  </div>
  }
</div>
