<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [resizable]="false"
  [focusOnShow]="false"
  (onShow)="onShow.emit()"
  [styleClass]="dialogStyleClass()"
  [pt]="pt"
  [closable]="false"
>
  <span
    class="icon-x-close text-gray-400 cursor-pointer absolute top-[32px] end-[32px] z-10"
    (click)="handleCloseClick()"
  ></span>
  <div class="flex max-h-full! h-full">
    <div class="steps-container bg-gray-50 ps-5 py-6 border-e border-gray-200 max-w-[300px] flex flex-col">
      <div class="inline-flex items-start flex-1">
        <img
          src="assets/images/long-logo.png"
          alt="logo"
          class="w-20"
          appImageError
        />
      </div>
      <div class="flex flex-col bg-gray-50 overflow-auto flex-6">
        @if(activeStep()){
        <p-stepper
          [value]="activeStep()"
          (valueChange)="activeStep.set($event ?? 1)"
          class="bg-gray-50 basis-[10rem]"
        >
          @for (step of steps(); track $index; let i = $index) {
          <p-step-item [value]="i + 1">
            <p-step
              [value]="i + 1"
              class="flex flex-row flex-auto gap-2 w-full max-w-full min-w-0"
            >
              <ng-template
                #content
                let-activateCallback="activateCallback"
                let-value="value"
              >
                <button
                  class="bg-transparent border-0 flex flex-col gap-2 w-full max-w-full"
                  (click)="activateCallback()"
                >
                  <app-wizard-step-state [stepState]="step" />
                </button>
              </ng-template>
            </p-step>
            <p-step-panel [ngClass]="{ 'hidden': i === steps().length - 1 }">
              <ng-template
                #content
                let-activateCallback="activateCallback"
              >
                <div class="h-[70px]"></div>
              </ng-template>
            </p-step-panel>
          </p-step-item>
          }
        </p-stepper>
        }
      </div>
    </div>
    <div class="flex flex-col overflow-hidden flex-1 pb-4 gap-[24px] bg-white">
      <div class="header flex flex-col gap-2 bg-white py-5 px-8">
        <div class="flex items-center gap-3">
          <h3 class="text-2xl font-semibold">{{wizardTitle()}}</h3>
          <ng-content select="status"></ng-content>
        </div>
        <ng-content select="status-extra"></ng-content>
      </div>
      <div
        class="flex-1 py-6 overflow-auto max-w-full mx-6"
        #scrollableContent
      >
        @for (step of steps(); track $index; let i = $index) { @if (activeStep() === i + 1) {
        @for (content of stepContents(); track content.stepNumber) { @if (content.stepNumber === i +
        1) {
        <ng-container *ngTemplateOutlet="content.templateRef"></ng-container>
        } } } }
      </div>
      <div class="pt-[16px] border-t border-gray-200 mx-6">
        <app-base-wizard-actions [actions]="actions()" />
      </div>
    </div>
  </div>
</p-dialog>
