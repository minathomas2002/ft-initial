<div class="flex flex-col gap-6 bg-white p-6 rounded-[8px]  border border-[#D5D6DD]">
  <app-summary-section-header
    [title]="pageTitleForTL"
    [hideEditButton]="hideEditButton()"
    [isExpanded]="isExpanded()"
    (onEdit)="onEdit.emit()"
    (onToggleExpand)="toggleExpanded()"
  />

  @if (isExpanded()) {
  <div class="flex flex-col gap-4">
    <h3 class="plans-summary-subsection-title">{{ 'plans.summary.overview' | translate }}</h3>
    <app-overview-summary-section
      [sectionFormGroup]="overviewFormGroup()"
      [sectionSummaryFields]="overviewSummaryFields()"
      [doRefresh]="doRefresh()"
    />
  </div>

  <div class="flex flex-col gap-4">
    <h3 class="plans-summary-subsection-title">{{ 'plans.summary.expectedCAPEXInvestment' | translate }}</h3>
    <app-expected-capex-summary-section
      [sectionFormGroup]="expectedCAPEXInvestmentFormGroup()"
      [sectionSummaryFields]="expectedCAPEXInvestmentSummaryFields()"
      [doRefresh]="doRefresh()"
    />
  </div>

  <div class="flex flex-col gap-4">
    <h3 class="plans-summary-subsection-title">{{ 'plans.summary.targetCustomers' | translate }}</h3>
    <app-target-customers-summary-section
      [sectionFormGroup]="targetCustomersFormGroup()"
      [sectionSummaryFields]="targetCustomersSummaryFields()"
      [doRefresh]="doRefresh()"
    />
  </div>

  <div class="flex flex-col gap-4">
    <h3 class="plans-summary-subsection-title">{{ 'plans.summary.productManufacturingExperience' | translate }}</h3>
    <app-product-manufacturing-experience-summary-section
      [sectionFormGroup]="productManufacturingExperienceFormGroup()"
      [sectionSummaryFields]="productManufacturingExperienceSummaryFields()"
      [doRefresh]="doRefresh()"
    />
  </div>

  @if (shouldShowCommentBox()) {
  <app-page-comment-box
    [commentTitle]="commentForPage().title"
    [commentText]="commentForPage().text || 'No comment found'"
  />
  }
  }
</div>
