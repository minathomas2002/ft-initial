<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <app-plan-summary-flied [planSummaryField]="targetedCustomerSummaryField()" />

  @let namesOfTargetedSuppliers = namesOfTargetedSuppliersSummaryField();
  @if (showNamesOfTargetedSuppliersAndProducts()) {
    <app-plan-summary-flied [planSummaryField]="namesOfTargetedSuppliers" />
  }

  @let productsUtilizeTargetedProduct = productsUtilizeTargetedProductSummaryField();
  @if (showNamesOfTargetedSuppliersAndProducts()) {
    <app-plan-summary-flied [planSummaryField]="productsUtilizeTargetedProduct" />
  }
</div>
