<div class="flex flex-col gap-6 bg-white">
  <app-summary-section-header
    [title]="pageTitleForTL"
    [isViewMode]="isViewMode()"
    (onEdit)="onEdit.emit()"
  />

  <div class="flex flex-col gap-6">
    <div class="flex flex-col gap-3">
      <app-saudization-section-summary
        [saudizationFormGroup]="saudizationFormGroup()"
        [sectionSummaryFields]="sectionSummaryFields()"
        [rowLabels]="rowLabels()"
      />
    </div>

    <div class="flex flex-col gap-2">
      <h3 class="text-base font-semibold text-gray-900">{{ 'plans.summary.attachments' | translate }}</h3>
      @if (hasAttachments()) {
      <div class="flex flex-wrap gap-2">
        @for (file of attachments(); track $index) {
        <span class="text-sm text-gray-700">{{ file?.fileName ?? file?.name ?? ('File ' + ($index + 1)) }}</span>
        }
      </div>
      } @else {
      <span class="text-sm text-gray-500">-</span>
      }
    </div>
  </div>

  @if (commentForPage()) {
  <app-page-comment-box
    [commentTitle]="commentForPage()!.title"
    [commentText]="commentForPage()!.text"
  />
  }
</div>
