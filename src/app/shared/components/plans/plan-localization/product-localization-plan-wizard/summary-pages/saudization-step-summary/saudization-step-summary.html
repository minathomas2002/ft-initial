<div class="flex flex-col gap-6 bg-white p-6 rounded-[8px]  border border-[#D5D6DD]">
  <app-summary-section-header
    [title]="pageTitleForTL"
    [hideEditButton]="hideEditButton()"
    [isExpanded]="isExpanded()"
    (onEdit)="onEdit.emit()"
    (onToggleExpand)="toggleExpanded()"
  />

  @if (isExpanded()) {
  <div class="flex flex-col gap-6">
    <div class="flex flex-col gap-3">
      <app-saudization-section-summary
        [sectionFormGroup]="saudizationFormGroup()"
        [sectionSummaryFields]="sectionSummaryFields()"
        [rowLabels]="rowLabels()"
        [doRefresh]="doRefresh()"
      />
    </div>

    <div class="flex flex-col gap-2">
      <app-attachments-summary-section
        [sectionFormGroup]="attachmentsFormGroup()"
        [sectionSummaryFields]="attachmentsSummaryFields()"
        [doRefresh]="doRefresh()"
      />
    </div>

    @if (shouldShowCommentBox()) {
    <app-page-comment-box
      [commentTitle]="commentForPage().title"
      [commentText]="commentForPage().text || 'No comment found'"
    />
    }
  </div>
  }
