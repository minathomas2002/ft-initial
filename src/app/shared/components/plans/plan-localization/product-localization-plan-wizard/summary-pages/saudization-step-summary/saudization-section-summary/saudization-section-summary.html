<div class="flex flex-col gap-2 overflow-x-auto">
  <div class="rounded-2xl overflow-hidden border border-gray-300">
    <p-table
      [value]="rows()"
      [tableStyle]="{ 'border-collapse': 'collapse', width: '100%' }"
      styleClass="w-full text-sm [&_th]:!border-e [&_td]:!border-e [&_th]:!border-gray-300 [&_td]:!border-gray-300"
    >
      <ng-template pTemplate="header">
        <tr class="[&_th]:bg-[#F9FAFA]! [&_th]:text-[#4A4E5A]!">
          <th class="p-3 text-left text-sm font-semibold text-[#4A4E5A]"></th>
          @for (y of [1,2,3,4,5,6,7]; track y) {
          <th class="p-3 text-left text-sm font-semibold text-[#4A4E5A]">{{ 'plans.summary.year' | translate }} {{ y }}</th>
          }
        </tr>
      </ng-template>
      <ng-template
        pTemplate="body"
        let-row
      >
        <tr class="hover:bg-gray-50/50">
          <td class="border-t border-gray-300 p-3 font-medium text-gray-700">{{ row.label }}</td>
          @for (y of [row.year1, row.year2, row.year3, row.year4, row.year5, row.year6, row.year7]; track $index) {
          <td class="border-t border-gray-300 p-3">
            <app-plan-summary-flied [planSummaryField]="getSummaryField(y, formatDisplayValue(y.value, row.rowKey === 'saudizationPercentage' || row.rowKey === 'saudiCompensationPercentage'))" />
          </td>
          }
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
