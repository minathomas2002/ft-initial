<div
  class="flex flex-col w-full rounded-xl border border-[#d5d6dd] bg-white overflow-hidden shadow-[0px_1px_2px_0px_rgba(10,13,18,0.05)]"
  role="region"
  [attr.aria-label]="'plans.form.totalCostIndicator.title' | translate"
>
  <div class="flex w-full items-center gap-3 border-b border-[#d5d6dd] bg-[#4767a5] px-5 py-3 rounded-t-xl">
    <div
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md border border-[#bbbec8] bg-white shadow-[0px_1px_2px_0px_rgba(10,13,18,0.05)]"
      aria-hidden="true"
    >
      <i class="icon-currency-dollar-circle text-base text-[#4767a5]"></i>
    </div>
    <p class="flex-1 min-w-0 text-base font-semibold leading-6 text-white">
      {{ 'plans.form.totalCostIndicator.title' | translate }}
    </p>
  </div>

  <div class="flex flex-col gap-4 p-4 w-full">
    <div class="flex flex-wrap items-start justify-between gap-3 w-full">
      <div class="flex min-w-0 flex-1 flex-col gap-1">
        <div class="flex flex-wrap items-end gap-1">
          <span class="text-[30px] font-semibold leading-[38px] text-[#4a4e5a] whitespace-nowrap">
            {{ displayPercentage() }} %
          </span>
          <span class="pb-[3px] text-sm font-normal leading-5 text-[#606675] whitespace-nowrap">
            {{ 'plans.form.totalCostIndicator.ofTotalCost' | translate }}
          </span>
        </div>
        <p class="text-sm font-normal leading-5 text-[#606675] w-full">
          {{ 'plans.form.totalCostIndicator.description' | translate }}
        </p>
      </div>

      <div class="inline-flex shrink-0 items-center gap-1 rounded-md border border-[#bbbec8] bg-white px-1.5 py-0.5 shadow-[0px_1px_1px_rgba(10,13,18,0.05)]">
        <span
          class="h-2 w-2 shrink-0 rounded-full bg-amber-400"
          aria-hidden="true"
        ></span>
        <span class="text-xs font-medium leading-[18px] text-[#4a4e5a] whitespace-nowrap">
          {{ 'plans.form.totalCostIndicator.includedInCostOnly' | translate }}
        </span>
      </div>
    </div>

    <ng-content></ng-content>
  </div>
</div>
