<!-- todo: handel resting the form control when user click on X button in the header -->
<app-base-dialog
  [(visible)]="visible"
  [icon]="'icon-message-circle'"
  [confirmLabel]="'common.save' | translate"
  [cancelLabel]="'common.back' | translate"
  [confirmButtonClass]="'w-[100px]'"
  [cancelButtonClass]="'w-[75px]'"
  (onConfirm)="onConfirm()"
  (onClose)="onClose()"
  [isConfirmationDisabled]="formControl.invalid"
>
  <div class="modal-content-wrapper max-w-[600px]">
    <!-- Disclaimer Message - appears right after title -->
    <div class="disclaimer-container">
      <h2 class="text-lg font-semibold text-gray-900">{{ 'plans.comments.addComment' | translate }}</h2>
      <p class="text-sm text-gray-600">
        {{ 'plans.comments.clarifyFeedback' | translate }}
      </p>
    </div>

    <div class="flex flex-col mt-5">
      <app-base-label [title]="'plans.comments.yourComment' | translate" />
      <textarea
        rows="8"
        cols="100"
        pTextarea
        [formControl]="formControl"
        maxlength="255"
        [appHidePlaceholderWhenDisabledEmpty]="'plans.comments.enterComment' | translate"
      ></textarea>
      <div class="text-xs text-gray-500 text-right mt-1">
        {{ formControl.value?.length || 0 }} / 255
      </div>
      <app-base-error-messages
        [control]="formControl"
        [label]="'plans.comments.yourComment' | translate"
      />
    </div>
  </div>
</app-base-dialog>
