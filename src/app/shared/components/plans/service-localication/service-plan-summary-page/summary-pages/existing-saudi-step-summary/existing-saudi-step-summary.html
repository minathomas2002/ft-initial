<div class="flex flex-col gap-6 bg-white">
  <app-summary-section-header
    [title]="pageTitleForTL"
    [isViewMode]="isViewMode()"
    (onEdit)="onEdit.emit()"
  />

  <app-saudi-company-details-summary-section
    [sectionFormGroup]="existingSaudiFormGroup()"
    [sectionSummaryFields]="saudiCompanyDetailsSummaryFields()"
  />

  <app-collaboration-partnership-summary-section
    [sectionFormGroup]="existingSaudiFormGroup()"
    [sectionSummaryFields]="collaborationPartnershipSummaryFields()"
  />

  <app-entity-level-summary-section
    [sectionFormGroup]="existingSaudiFormGroup()"
    [sectionSummaryFields]="entityLevelSummaryFields()"
  />

  <app-service-level-summary-section
    [sectionFormGroup]="existingSaudiFormGroup()"
    [sectionSummaryFields]="serviceLevelSummaryFields()"
  />

  <app-attachments-summary-section
    [sectionFormGroup]="attachmentsFormGroup()"
    [sectionSummaryFields]="attachmentsSummaryFields()"
    [translateKey]="'plans.summary.attachments'"
  />

  @if (commentForPage()) {
  <app-page-comment-box
    [commentTitle]="commentForPage()!.title"
    [commentText]="commentForPage()!.text"
  />
  }
</div>
