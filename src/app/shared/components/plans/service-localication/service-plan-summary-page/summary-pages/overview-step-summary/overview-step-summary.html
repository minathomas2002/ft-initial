<div class="flex flex-col gap-6 bg-white p-6 rounded-[8px]  border border-[#D5D6DD]">
  <app-summary-section-header
    [title]="pageTitleForTL"
    [hideEditButton]="hideEditButton()"
    [isExpanded]="isExpanded()"
    (onEdit)="onEdit.emit()"
    (onToggleExpand)="toggleExpanded()"
  />

  @if (isExpanded()) {
  <app-overview-basic-information-summary-section
    [sectionFormGroup]="basicInformationFormGroup()"
    [sectionSummaryFields]="basicInformationSummaryFields()"
    [doRefresh]="doRefresh()"
  />

  <app-overview-company-information-summary-section
    [sectionFormGroup]="overviewCompanyInformationFormGroup()"
    [sectionSummaryFields]="overviewCompanyInformationSummaryFields()"
    [doRefresh]="doRefresh()"
  />

  <div class="flex flex-col gap-6">
    <app-overview-location-information-summary-section
      [sectionFormGroup]="locationInformationFormGroup()"
      [sectionSummaryFields]="locationInformationSummaryFields()"
      [doRefresh]="doRefresh()"
    />

    @if (showLocalAgentInformation()) {
    <app-overview-local-agent-information-summary-section
      [sectionFormGroup]="localAgentInformationFormGroup()"
      [sectionSummaryFields]="localAgentInformationSummaryFields()"
      [doRefresh]="doRefresh()"
    />
    }
  </div>

  <app-overview-service-details-summary-section
    [sectionFormGroup]="overviewFormGroup()"
    [sectionSummaryFields]="serviceDetailsSummaryFields()"
    [doRefresh]="doRefresh()"
  />

  @if (shouldShowCommentBox()) {
  <app-page-comment-box
    [commentTitle]="commentForPage().title"
    [commentText]="commentForPage().text || ('plans.noCommentFound' | translate)"
  />
  }
  }
</div>
