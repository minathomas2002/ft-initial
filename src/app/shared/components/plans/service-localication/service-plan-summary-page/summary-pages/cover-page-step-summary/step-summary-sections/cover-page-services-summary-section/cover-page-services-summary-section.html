<div class="flex flex-col gap-4">
  <h3 class="text-lg font-semibold text-gray-900">Services</h3>
  <div class="flex flex-col gap-2">
    @for (row of serviceRows(); track $index) {
    <div class="flex flex-col gap-1">
      @if (row.label) {
      <span class="text-sm font-medium text-gray-700">{{ row.label }}</span>
      }
      <app-plan-summary-flied [planSummaryField]="row.summaryField" />
    </div>
    }
  </div>
</div>
