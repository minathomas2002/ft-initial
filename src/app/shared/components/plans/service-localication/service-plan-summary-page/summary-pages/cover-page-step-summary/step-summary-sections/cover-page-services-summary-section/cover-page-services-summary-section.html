<!-- Services Section -->
<div class="flex flex-col gap-4">
  <h3 class="text-md font-semibold text-gray-900">Services</h3>
  <div class="overflow-x-auto">
    <div class="rounded-2xl overflow-hidden border border-gray-300">
      <p-table
        [value]="serviceRows()"
        [tableStyle]="{ 'border-collapse': 'collapse', width: '100%' }"
      >
        <ng-template pTemplate="header">
          <tr class="[&_th]:bg-[#F9FAFA]! [&_th]:text-[#4A4E5A]!">
            <th class="p-3 text-left text-sm font-medium text-[#4A4E5A]">Service Name</th>
          </tr>
        </ng-template>

        <ng-template
          pTemplate="body"
          let-service
          let-rowIndex="rowIndex"
        >
          <tr>
            <td class="border-t border-gray-300 p-4">
              <app-plan-summary-flied [planSummaryField]="serviceRows()[rowIndex].summaryField" />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
