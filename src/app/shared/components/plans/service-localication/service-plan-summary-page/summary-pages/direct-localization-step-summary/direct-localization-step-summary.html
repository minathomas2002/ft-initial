<div class="flex flex-col gap-6 bg-white p-6 rounded-[8px]  border border-[#D5D6DD]">
  <app-summary-section-header
    [title]="pageTitleForTL"
    [hideEditButton]="hideEditButton()"
    [isExpanded]="isExpanded()"
    (onEdit)="onEdit.emit()"
    (onToggleExpand)="toggleExpanded()"
  />

  @if (isExpanded()) {
  <app-localization-strategy-summary-section
    [sectionFormGroup]="directLocalizationFormGroup()"
    [sectionSummaryFields]="localizationStrategySummaryFields()"
    [doRefresh]="doRefresh()"
  />

  <app-entity-level-summary-section
    [sectionFormGroup]="directLocalizationFormGroup()"
    [sectionSummaryFields]="entityLevelSummaryFields()"
    [doRefresh]="doRefresh()"
    [pageNumber]="4"
  />

  <app-service-level-summary-section
    [sectionFormGroup]="directLocalizationFormGroup()"
    [sectionSummaryFields]="serviceLevelSummaryFields()"
    [pageNumber]="4"
    [doRefresh]="doRefresh()"
    expectedDateControlKey="serviceLevelLocalizationDate"
  />

  @if (shouldShowCommentBox()) {
  <app-page-comment-box
    [commentTitle]="commentForPage().title"
    [commentText]="commentForPage().text || ('plans.noCommentFound' | translate)"
  />
  }
  }
</div>
