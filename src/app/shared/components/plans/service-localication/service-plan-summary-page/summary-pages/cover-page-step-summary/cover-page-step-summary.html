<div class="flex flex-col gap-6 bg-white">
  <app-summary-section-header
    [title]="pageTitleForTL"
    [isViewMode]="isViewMode()"
    (onEdit)="onEdit.emit()"
  />

  <app-cover-page-company-information-summary-section
    [sectionFormGroup]="coverPageCompanyInformationFormGroup()"
    [sectionSummaryFields]="coverPageCompanyInformationSummaryFields()"
  />

  <app-cover-page-services-summary-section
    [sectionFormGroup]="coverPageFormGroup()"
    [sectionSummaryFields]="coverPageServicesSummaryFields()"
  />

  @if (commentForPage()) {
  <app-page-comment-box
    [commentTitle]="commentForPage()!.title"
    [commentText]="commentForPage()!.text"
  />
  }
</div>
