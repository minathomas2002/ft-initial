<div class="flex flex-col gap-[32px] pb-10">

  <div class="flex flex-col gap-4">
    <h2 class="text-lg font-semibold text-gray-900">{{ 'plans.form.companyInformation' | translate }}</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">
      <div class="flex flex-col gap-2 col-span-1">
        <app-base-label [title]="'plans.newPlan.planTitle' | translate" />

        <app-group-input-with-checkbox
          [showCheckbox]="showCheckbox()"
          [hasCommentControl]="
            getHasCommentControl(coverPageCompanyInformationFormGroup.get('planTitle'))
          "
          (valueChanged)="upDateSelectedInputs($event, {
            section: 'companyInformation',
            inputKey: 'planTitle',
            label: 'plans.newPlan.planTitle'
          })"
        >
          <input
            pInputText
            [appHidePlaceholderWhenDisabledEmpty]="'plans.newPlan.enterPlanTitle' | translate"
            [formControl]="getCoverPageValueControl('planTitle')"
            fluid
            maxlength="150"
            trimOnBlur
            [appConditionalColorClass]="highlightInput('planTitle')"
            [color]="isViewMode() && isFieldShouldbeCorrected('planTitle', 'companyInformation') ? 'green' : selectedInputColor()"
          />
        </app-group-input-with-checkbox>

        <app-base-error-messages
          [control]="getCoverPageValueControl('planTitle')"
          [label]="'plans.newPlan.planTitle' | translate"
        />
      </div>

      <div class="flex flex-col gap-2 col-span-1">
        <app-base-label [title]="'plans.newPlan.companyName' | translate" />

        <app-group-input-with-checkbox
          [showCheckbox]="showCheckbox()"
          [hasCommentControl]="
            getHasCommentControl(coverPageCompanyInformationFormGroup.get('companyName'))
          "
          (valueChanged)="upDateSelectedInputs($event, {
            section: 'companyInformation',
            inputKey: 'companyName',
            label: 'plans.newPlan.companyName'
          })"
        >
          <input
            pInputText
            [appHidePlaceholderWhenDisabledEmpty]="'plans.newPlan.enterCompanyName' | translate"
            [formControl]="getCoverPageValueControl('companyName')"
            fluid
            maxlength="100"
            trimOnBlur
            [appConditionalColorClass]="highlightInput('companyName')"
            [color]="isViewMode() && isFieldShouldbeCorrected('companyName', 'companyInformation') ? 'green' : selectedInputColor()"
          />
        </app-group-input-with-checkbox>

        <app-base-error-messages
          [control]="getCoverPageValueControl('companyName')"
          [label]="'plans.newPlan.companyName' | translate"
        />
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-4">
    <h2 class="text-lg font-semibold text-gray-900">{{ 'plans.form.services' | translate }}</h2>
    <div class="border border-gray-300 rounded-2xl">
      <app-form-array-input
        [ft]="
      getServicesFormArray()"
        [hideAddButton]="isViewMode()"
        [hideDeleteButton]="isViewMode()"
        [addButtonMessage]="'plans.form.addService' | translate"
        [createNewItem]="createServiceItem"
        [excludeKeys]="['serviceId']"
      >
        <ng-template
          #itemTemplate
          let-itemControl
          let-index="index"
        >
          <td class="p-3 border border-gray-200 min-w-[300px]">
            <app-group-input-with-checkbox
              [hasCommentControl]="getHasCommentControl(itemControl.get('serviceName'))"
              [showCheckbox]="showCheckbox()"
              (valueChanged)="upDateSelectedInputs($event, {
                    section: 'services',
                    inputKey: 'serviceName',
                    label: 'plans.form.serviceName'
                  }, itemControl.get('rowId')?.value)"
            >
              <input
                type="text"
                pInputText
                fluid
                [appHidePlaceholderWhenDisabledEmpty]="'plans.form.enterServiceName' | translate"
                [maxlength]="100"
                [formControl]="getValueControl(itemControl.get('serviceName'))"
                trimOnBlur
                [appConditionalColorClass]="highlightInput('serviceName', itemControl.get('rowId')?.value)"
                [color]="selectedInputColor()"
              />
            </app-group-input-with-checkbox>

            <app-base-error-messages
              [control]="getValueControl(itemControl.get('serviceName'))"
              [label]="'plans.form.serviceName' | translate"
            />
          </td>
        </ng-template>
      </app-form-array-input>
    </div>
  </div>

  <app-comment-input
    [commentFormControl]="commentFormControl"
    [commentPhase]="commentPhase()"
  />

  @if(showCheckbox() || (showCommentState() && (!isResubmitMode() || pageComments().length > 0))){
  <app-comment-state-component
    [commentsCount]="selectedInputs().length"
    [(commentPhase)]="commentPhase"
    [commentFormControl]="commentFormControl"
      [incomingCommentText]="incomingCommentText()"
    [isResubmitMode]="isResubmitMode()"
    [hasInvestorComment]="hasInvestorComment()"
    (deleteComments)="onDeleteComments()"
    (saveComment)="commentPhase() === 'editing' ? onSaveEditedComment() : onSaveComment($event)"
    (startEditing)="onStartEditing()"
  />
  }

  @if(showDeleteConfirmationDialog()){
  <app-general-confirmation-dialog
    [(visible)]="showDeleteConfirmationDialog"
    [title]="(isInvestorPersona() ? 'plans.comments.deleteCommentTitle' : 'plans.comments.deleteCommentAndFieldsTitle') | translate"
    [confirmationLabel]="'common.delete' | translate"
    [cancelLabel]="'common.cancel' | translate"
    [confirmButtonSeverity]="'danger'"
    [icon]="'icon-trash-2'"
    (confirmed)="onConfirmDeleteComment()"
    (onCancel)="onCancelDeleteComment()"
  />
  }
</div>
