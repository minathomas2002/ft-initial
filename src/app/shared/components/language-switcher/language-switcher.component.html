<button
	type="button"
	class="language-switcher__pill"
	(click)="onLanguageChange(otherLanguage())"
	[attr.aria-label]="ariaLabel()"
>
	<span class="language-switcher__label">{{ otherLanguageOption().label }}</span>
	<span
		class="language-switcher__flag"
		[class.language-switcher__flag--sa]="otherLanguage() === 'ar'"
		[class.language-switcher__flag--uk]="otherLanguage() === 'en'"
		aria-hidden="true"
	>
		<img [src]="otherLanguageOption().icon" alt="" />
	</span>
</button>
