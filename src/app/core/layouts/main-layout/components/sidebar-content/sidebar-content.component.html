<div class="flex flex-col justify-between h-full" [class.sidebar-collapsed]="collapsed()">
  <div>
    @if (!collapsed()) {
      <app-base-logo class="cursor-pointer" />
    }
    <div class="sidebar-links mt-[48px]" [class.mt-4]="collapsed()">
      <ul class="list-unstyles">
        @for(link of sidebarLinks(); track link.routerLink){
        @if(link.show){
        <li class="mb-[8px]">
          @if(link.children && link.children.length > 0){
          <app-sidebar-dropdown
            [link]="link"
            [collapsed]="collapsed()"
            (onCloseSidebarDrawer)="closeSidebarDrawer()"
          ></app-sidebar-dropdown>
          }
          @else {
          <app-sidebar-link
            [link]="link"
            [collapsed]="collapsed()"
            (click)="closeSidebarDrawer()"
          ></app-sidebar-link>
          }
        </li>
        }
        }
      </ul>
    </div>
  </div>
  <div>
    <div class="sidebar-links mt-[48px]" [class.mt-4]="collapsed()">
      <ul class="list-none">

        @if(canContactUs()){
        <li
          class="mb-[8px]"
          (click)="AddContactUsDialogVisible.set(true)"
        >
          <a class="flex items-center hover:!bg-gray-50 text-[16px] transition-all block w-full p-3 rounded-lg font-semibold p-[12px] cursor-pointer">
            <i class="icon-life-buoy text-gray-400 text-xl w-[25px] flex-shrink-0" [class.me-[11px]]="!collapsed()"></i>
            @if (!collapsed()) {
              <span>Contact Us</span>
            }
          </a>
        </li>
        }
      </ul>
    </div>
  </div>
</div>

@if(AddContactUsDialogVisible()){
<app-add-contact-us-dialog [(dialogVisible)]="AddContactUsDialogVisible"></app-add-contact-us-dialog>
}
