<app-base-dialog
  [(visible)]="dialogVisible"
  icon="icon-life-buoy"
  [confirmLabel]="'contactUs.dialog.contactUs' | translate"
  [confirmButtonClass]="'w-fit'"
  [cancelButtonClass]="'w-fit'"
  (onConfirm)="onConfirm()"
  (onClose)="resetForm()"
  [isConfirmationDisabled]="formService.form.invalid"
  (onCancel)="resetForm()"
>
  <div class="mb-5">
    <p class="text-lg font-semibold text-gray-900 mb-1">
      {{ 'contactUs.dialog.contactUs' | translate }}
    </p>
  </div>

  <div class="flex flex-col gap-4">
    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >{{ 'contactUs.dialog.title' | translate }}
      </label>

      <input
       pInputText
        class=" p-component p-filled w-full h-32 resize-none"
        type="text"
        pInputText
        [placeholder]="'contactUs.dialog.titlePlaceholder' | translate"
        [formControl]="formService.title"
      />
        <div class="mt-1">
           <app-base-error-messages
          [control]="getControl('title')"
          [label]="'contactUs.dialog.title' | translate"
        />
        </div>

    </div>
    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >{{ 'contactUs.dialog.description' | translate }}
      </label>
      <textarea
        pTextarea
        fluid
        rows="5"
        placeholder="{{ 'contactUs.dialog.descriptionPlaceholder' | translate }}"
        [formControl]="formService.description"
      ></textarea>
        <div class="mt-1">
           <app-base-error-messages
          [control]="getControl('description')"
          [label]="'contactUs.dialog.description' | translate"
        />

        </div>
    </div>
  </div>
</app-base-dialog>
