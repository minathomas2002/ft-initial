<app-base-dialog
  [(visible)]="dialogVisible"
  icon="icon-life-buoy"
  [confirmLabel]="'contactUs.dialog.send' | translate"
  [confirmButtonClass]="'w-[100px]'"
  [cancelButtonClass]="'w-[80px]'"
  (onConfirm)="onConfirm()"
  (onClose)="resetForm()"
  [isConfirmationDisabled]="formService.form.invalid"
  (onCancel)="resetForm()"
>
  <div class="mb-5">
    <p class="text-lg font-semibold text-gray-900 mb-1">
      {{ 'contactUs.dialog.contactUs' | translate }}
    </p>
  </div>

  <div class="flex flex-col gap-4">
    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1">{{ 'contactUs.dialog.title' | translate }}
      </label>

      <input
        pInputText
        class=" p-component p-filled w-full h-32 resize-none"
        type="text"
        pInputText
        maxlength="150"
        [placeholder]="'contactUs.dialog.titlePlaceholder' | translate"
        [formControl]="formService.title"
      />
      <app-base-error-messages
        [control]="getControl('title')"
        [label]="'contactUs.dialog.title' | translate"
      />

    </div>
    <div class="form-group">
      <label class="block text-sm font-medium text-gray-700 mb-1">{{ 'contactUs.dialog.description' | translate }}
      </label>
      <textarea
        pTextarea
        fluid
        rows="5"
        maxlength="1000"
        placeholder="{{ 'contactUs.dialog.descriptionPlaceholder' | translate }}"
        [formControl]="formService.description"
      ></textarea>
      <div class="text-xs text-gray-500 text-right mt-1">{{ formService.description.value?.length || 0 }} / 1000</div>
      <app-base-error-messages
        [control]="getControl('description')"
        [label]="'contactUs.dialog.description' | translate"
      />
    </div>
  </div>
</app-base-dialog>
