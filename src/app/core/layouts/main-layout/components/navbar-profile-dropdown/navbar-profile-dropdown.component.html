<button
  #profileTrigger
  (click)="toggleProfilePopover($event)"
  class="w-full border-0 bg-transparent text-start rounded-none"
>
  <div class="items-center md:!flex hidden text-sm">
    <app-identify-user
      [userName]="authStore.userProfile()?.nameEN!"
      [userTitle]="authStore.userProfile()?.roleNames?.[0] || authStore.userCode()!"
      [userAvatar]="userProfilePicture()"
    ></app-identify-user>

    @if (dropdownItems().length) {
    <i class="icon-chevron-down ms-[18px] text-gray-400 {{ isOpen() ? 'rotate-180' : 'rotate-none' }} transition-all"></i>
    }
  </div>

  <p-avatar
    [image]="userProfilePicture()!"
    class="!w-[40px] !h-[40px] md:!hidden block"
    shape="circle"
    size="large"
  />
</button>

<p-popover
  #profilePopover
  appendTo="body"
  [dismissable]="true"
  (onShow)="isOpen.set(true)"
  (onHide)="isOpen.set(false)"
  styleClass="profile-dropdown-popover min-w-[280px]"
>
  <!-- Current user profile section -->
  <div class="flex flex-col border border-gray-200 rounded-xl">
    @if (hasImpersonationOptions()) {
    <!-- Switch accounts section -->
    <div class="px-4 py-3">
      <h3 class="mb-3 text-sm font-normal text-gray-900">
        {{ i18nService.translate('navigation.switchAccounts') }}
      </h3>
      <div class="flex flex-col gap-1">
        @for (option of impersonationOptionsWithCurrentUser(); track option.userId) {
        <button
          type="button"
          (click)="onAccountSelect(option)"
          class="flex w-full cursor-pointer items-center gap-3 rounded-lg px-3 py-2 text-left transition-colors hover:bg-gray-100"
          [class.bg-gray-100]="isCurrentAccount(option)"
        >
          <p-avatar
            [image]="option.profilePic || 'assets/images/user_placeholder.svg'"
            class="!h-9 !w-9 shrink-0"
            shape="circle"
            size="normal"
          />
          <div class="min-w-0 flex-1">
            <span class="block truncate font-medium text-gray-900">
              {{ i18nService.currentLanguage() === 'ar' ? option.nameAr : option.nameEn }}
            </span>
            <span class="block truncate text-sm text-gray-600">
              {{ getRoleLabel(option.role) }}
            </span>
          </div>
          <p-radiobutton
            [ngModel]="selectedAccountId()"
            (click)="$event.stopPropagation()"
            [inputId]="'account-' + option.userId"
            name="impersonation-account"
            [value]="option.userId"
          />
        </button>
        }
      </div>
    </div>
    <p-divider class="!my-0" />
    }

    <!-- Dropdown items (View profile, Sign out) -->
    <div class="px-2 py-2">
      @for (item of dropdownItems(); track item.label) {
      @if (item.routerLink) {
      <a
        [routerLink]="item.routerLink"
        (click)="profilePopover.hide()"
        class="flex w-full cursor-pointer items-center gap-3 rounded-lg px-3 py-2 text-left text-gray-900 no-underline transition-colors hover:bg-gray-100"
      >
        <i class="{{ item.icon }} text-gray-600"></i>
        <span>{{ item.label }}</span>
      </a>
      } @else if (item.command) {
      <button
        type="button"
        (click)="executeItemCommand(item)"
        class="flex w-full cursor-pointer items-center gap-3 rounded-lg px-3 py-2 text-left text-gray-900 transition-colors hover:bg-gray-100"
      >
        <i class="{{ item.icon }} text-gray-600"></i>
        <span>{{ item.label }}</span>
      </button>
      }
      }
    </div>
  </div>
</p-popover>
